name: Build Ghata Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform
        run: flutter create --platforms=windows .

      - name: Set Ghata Windows icon
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          python -c "from PIL import Image; im=Image.open('assets/windows/ghata_icon.png').convert('RGBA'); im.save('windows/runner/resources/app_icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Get packages
        run: flutter pub get

      - name: Build Windows release
        run: >
          flutter build windows --release
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Ghata Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\ghata.iss"
          if (!(Test-Path "installer\output\Ghata-Setup.exe")) {
            throw "Ghata installer was not created"
          }

      - name: Package Windows app
        shell: pwsh
        run: |
          $source = "build\windows\x64\runner\Release"
          if (!(Test-Path $source)) {
            throw "Windows release folder not found"
          }
          Compress-Archive -Path "$source\*" -DestinationPath "Ghata-Windows.zip" -Force

      - name: Upload Windows Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-${{ github.run_number }}"
          gh release create $tag "Ghata-Windows.zip" `
            --title "Ghata Windows ${{ github.run_number }}" `
            --notes "Ghata Windows desktop release." `
            --prerelease


      - name: Upload Ghata Installer
        uses: actions/upload-artifact@v4
        with:
          name: Ghata-Windows-Setup
          path: installer/output/Ghata-Setup.exe
          if-no-files-found: error
